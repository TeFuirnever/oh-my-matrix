<svg viewBox="0 0 1320 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">oh-my-matrix hand-drawn architecture</title>
  <desc id="desc">Hand-drawn architecture diagram showing OpenClaw Gateway, Autopilot, Dynamic Workflows, Permission Policy, audit, evidence, and verified output.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      .title { font-family: 'Kalam', 'PingFang SC', 'Noto Sans SC', cursive; font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .label { font-family: 'Kalam', 'PingFang SC', 'Noto Sans SC', cursive; font-size: 22px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; fill: #cbd5e1; }
      .tiny { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; fill: #94a3b8; }
      .note { font-family: 'Kalam', 'PingFang SC', 'Noto Sans SC', cursive; font-size: 18px; fill: #e2e8f0; }
      .box { fill: rgba(15, 23, 42, 0.96); stroke-width: 3; filter: url(#paperShadow); }
      .cyan { stroke: #22d3ee; }
      .green { stroke: #34d399; }
      .amber { stroke: #fbbf24; }
      .rose { stroke: #fb7185; }
      .blue { stroke: #60a5fa; }
      .violet { stroke: #a78bfa; }
      .line { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; }
      .strong { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="paperGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 Q 3 5 0 0" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 Q 3 5 0 0" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 Q 3 5 0 0" fill="#34d399"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 Q 3 5 0 0" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1320" height="780" fill="#0f172a"/>
  <rect width="1320" height="780" fill="url(#paperGrid)" opacity="0.7"/>
  <path d="M 40 66 C 260 37, 500 48, 710 42 C 930 35, 1118 50, 1285 36" class="line" opacity="0.35"/>
  <text x="54" y="66" class="title">oh-my-matrix: OpenClaw Agent Runtime Stack</text>
  <text x="55" y="94" class="sub">Autopilot keeps work alive · Dynamic Workflows fans it out · Permission Policy keeps the boundary</text>

  <g filter="url(#roughen)">
    <rect x="62" y="318" width="178" height="110" rx="18" class="box cyan"/>
    <text x="151" y="357" text-anchor="middle" class="label">User Goal</text>
    <text x="151" y="382" text-anchor="middle" class="sub">natural language</text>
    <text x="151" y="405" text-anchor="middle" class="tiny">what should be done?</text>

    <rect x="310" y="287" width="205" height="172" rx="22" class="box blue"/>
    <text x="413" y="331" text-anchor="middle" class="label">OpenClaw</text>
    <text x="413" y="357" text-anchor="middle" class="label">Gateway</text>
    <text x="413" y="388" text-anchor="middle" class="sub">plugin hooks</text>
    <text x="413" y="411" text-anchor="middle" class="tiny">session + tool dispatch</text>

    <rect x="610" y="150" width="250" height="154" rx="24" class="box green"/>
    <text x="735" y="193" text-anchor="middle" class="label">Autopilot</text>
    <text x="735" y="222" text-anchor="middle" class="sub">continuous execution</text>
    <text x="735" y="247" text-anchor="middle" class="tiny">goal · retry · stall · evidence</text>
    <text x="735" y="270" text-anchor="middle" class="tiny">projection · WORKFLOW.md</text>

    <rect x="600" y="448" width="270" height="168" rx="24" class="box amber"/>
    <text x="735" y="493" text-anchor="middle" class="label">Dynamic Workflows</text>
    <text x="735" y="522" text-anchor="middle" class="sub">.prose orchestration</text>
    <text x="735" y="548" text-anchor="middle" class="tiny">fan-out · pipeline · verify</text>
    <text x="735" y="571" text-anchor="middle" class="tiny">OpenProse runs subagents</text>

    <rect x="952" y="284" width="250" height="174" rx="24" class="box rose"/>
    <text x="1077" y="326" text-anchor="middle" class="label">Permission Policy</text>
    <text x="1077" y="356" text-anchor="middle" class="sub">shared runtime boundary</text>
    <text x="1077" y="382" text-anchor="middle" class="tiny">classifyCommand</text>
    <text x="1077" y="404" text-anchor="middle" class="tiny">decidePermission</text>
    <text x="1077" y="426" text-anchor="middle" class="tiny">audit JSONL</text>

    <rect x="986" y="547" width="188" height="92" rx="18" class="box violet"/>
    <text x="1080" y="586" text-anchor="middle" class="label">Audit Trail</text>
    <text x="1080" y="613" text-anchor="middle" class="sub">.autopilot/*.jsonl</text>

    <rect x="1026" y="93" width="210" height="98" rx="18" class="box cyan"/>
    <text x="1131" y="132" text-anchor="middle" class="label">Verified Output</text>
    <text x="1131" y="160" text-anchor="middle" class="sub">evidence + synthesis</text>
  </g>

  <path d="M 240 373 C 268 370, 284 370, 310 371" class="strong" stroke="#22d3ee" marker-end="url(#arrowCyan)" filter="url(#roughen)"/>
  <path d="M 515 321 C 555 276, 568 242, 610 222" class="strong" stroke="#34d399" marker-end="url(#arrowGreen)" filter="url(#roughen)"/>
  <path d="M 515 421 C 555 468, 565 508, 600 526" class="strong" stroke="#fbbf24" marker-end="url(#arrow)" filter="url(#roughen)"/>
  <path d="M 860 228 C 910 236, 928 286, 952 337" class="strong" stroke="#34d399" marker-end="url(#arrowGreen)" filter="url(#roughen)"/>
  <path d="M 870 529 C 921 513, 934 455, 952 407" class="strong" stroke="#fbbf24" marker-end="url(#arrowRose)" filter="url(#roughen)"/>
  <path d="M 1080 458 C 1082 493, 1082 515, 1080 547" class="strong" stroke="#a78bfa" marker-end="url(#arrow)" filter="url(#roughen)"/>
  <path d="M 1134 284 C 1135 244, 1135 220, 1132 191" class="strong" stroke="#22d3ee" marker-end="url(#arrowCyan)" filter="url(#roughen)"/>

  <g filter="url(#roughen)">
    <path d="M 636 633 C 730 682, 875 686, 1005 650" class="line"/>
    <text x="728" y="689" class="note">workflow branches are guarded before tool calls</text>
    <path d="M 620 132 C 759 96, 896 96, 1035 124" class="line"/>
    <text x="653" y="119" class="note">autopilot and workflows share safety primitives</text>
  </g>

  <g transform="translate(68 642)" filter="url(#roughen)">
    <rect x="0" y="0" width="430" height="86" rx="18" fill="rgba(15,23,42,0.92)" stroke="#475569" stroke-width="2.5"/>
    <text x="22" y="35" class="note">Read this as three lanes, not one feature:</text>
    <text x="22" y="62" class="tiny">continuous loop + parallel fan-out + runtime boundary</text>
  </g>
</svg>
