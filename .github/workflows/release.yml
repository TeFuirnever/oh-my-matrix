name: Release

# Automated release via Changesets. On every push to master, this workflow
# either:
#   1. Opens/updates a "Version Packages" PR if there are pending changesets, OR
#   2. Publishes packages to npm if a Version Packages PR was just merged.
#
# Contributor flow:  pnpm changeset  →  commit .changeset/*.md in your PR
# Maintainer flow:   merge the auto-generated "Version Packages" PR to release
#
# See CONTRIBUTING.md § Releasing for the full process.
# Local fallback:    ./scripts/publish.sh  (when CI is unavailable)

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false  # never cancel an in-progress publish

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published artifacts
        if: steps.changesets.outputs.published == 'true'
        run: ./scripts/verify-publish.sh

      - name: Summary
        if: always()
        run: |
          printf '### Release\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            printf 'Packages published to npm.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            printf 'Version Packages PR opened/updated.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No changesets pending. Nothing to publish.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'status: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
