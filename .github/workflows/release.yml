name: Release

# Automated version management via Changesets. On every push to master, this
# workflow opens/updates a "Version Packages" PR if there are pending changesets.
#
# npm publish is ALWAYS manual (run ./scripts/publish.sh locally after merging
# the Version Packages PR). This workflow does NOT publish to npm.
#
# Contributor flow:  pnpm changeset  →  commit .changeset/*.md in your PR
# Maintainer flow:   1. merge the auto-generated "Version Packages" PR (version bump + CHANGELOG)
#                    2. ./scripts/publish.sh locally to publish to npm
#
# See CONTRIBUTING.md § Releasing for the full process.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version Packages PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create or Update Version Packages Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          # version only — NO publish (npm publish is manual via ./scripts/publish.sh)
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          printf '### Release (version management)\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            printf 'Version Packages PR opened/updated.\n' >> "$GITHUB_STEP_SUMMARY"
            printf 'Merge it, then run `./scripts/publish.sh` locally to publish to npm.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No changesets pending.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'status: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
