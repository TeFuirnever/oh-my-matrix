name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on the same ref (mirrors oh-my-openagent / ECC).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (eslint + markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint && pnpm lint:md
      - name: Summary
        if: always()
        run: |
          printf '### Lint (eslint + markdownlint)\nstatus: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Summary
        if: always()
        run: |
          printf '### Typecheck\nstatus: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Summary
        if: always()
        run: |
          printf '### Commitlint\nstatus: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r test
      - name: Summary
        if: always()
        run: |
          printf '### Test (all workspaces)\nstatus: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  hook-priority:
    name: Hook priority ordering (DW > autopilot > 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert DW priority > autopilot priority > audit priority
        run: |
          DW=$(grep -oP 'BEFORE_TOOL_CALL_PRIORITY\s*=\s*\K\d+' packages/dynamic-workflows/index.ts) || { echo "ERROR: DW priority constant not found"; exit 1; }
          AP=$(grep -oP 'BEFORE_TOOL_CALL_PRIORITY\s*=\s*\K\d+' packages/autopilot/index.ts) || { echo "ERROR: autopilot priority constant not found"; exit 1; }
          echo "DW priority: $DW, Autopilot priority: $AP"
          [ "$DW" -gt "$AP" ] || (echo "ERROR: DW priority ($DW) must be > autopilot priority ($AP)" && exit 1)
          [ "$AP" -gt 9 ] || (echo "ERROR: Autopilot priority ($AP) must be > 9 (audit plugin)" && exit 1)
      - name: Summary
        if: always()
        run: |
          printf '### Hook priority ordering\nstatus: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Security audit (pnpm audit --prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - name: Summary
        if: always()
        run: |
          printf '### Security audit\nstatus: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
