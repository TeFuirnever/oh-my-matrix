stages:
  - verify

omm-verify:
  stage: verify
  image: node:22-slim
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    - pnpm test
    - pnpm lint
    - pnpm omm:scan-names
    - pnpm omm:verify-provenance
    - pnpm omm:verify-bundle
    - pnpm omm:generate-inlines:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
